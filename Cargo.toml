[package]
name = "axum-test"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
once_cell = "1.19"
bson = "2.14.0"
futures = "0.3.31"
hyper = "1"
